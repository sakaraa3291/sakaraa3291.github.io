<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラップ断面 — 競馬場・距離・クラス別のペース形状</title>
<meta name="theme-color" content="#0E161F">
<meta name="application-name" content="ラップ断面">
<meta name="apple-mobile-web-app-title" content="ラップ断面">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
:root{
  --board:#0E161F; --panel:#16202C; --panel2:#1D2A38; --rule:#27384A;
  --ink:#E9EFF5; --dim:#8195A8; --amber:#FFB13B; --turf:#5BC08A; --dirt:#D9945A;
  --hot:#FF6B4A; --cool:#4A9BD8;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--board);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}

header{border-bottom:2px solid var(--amber);padding-bottom:10px;margin-bottom:14px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;font-size:11.5px;color:var(--dim);font-family:var(--mono)}

.tabs{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tabs button{flex:1;background:var(--panel);color:var(--dim);border:0;padding:11px 4px;
  font-size:13.5px;font-weight:700;font-family:var(--sans);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--amber);color:#0E161F}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters .full{grid-column:1/-1}
label{display:block;font-size:10.5px;color:var(--dim);font-family:var(--mono);
  letter-spacing:.08em;margin-bottom:3px}
select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:9px 8px;font-size:14px;font-family:var(--sans);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

.readout{background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  padding:11px 12px;margin-bottom:10px}
.rTop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rTitle{font-size:14px;font-weight:700}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;
  letter-spacing:.06em}
.rGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cell .k{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.cell .v{font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.15}
.cell .v small{font-size:10px;color:var(--dim);font-weight:400}

.chartBox{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 4px 2px;margin-bottom:10px}
svg{display:block;width:100%;height:auto}

.stripWrap{margin-bottom:10px}
.stripLbl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:5px}
.strip{display:flex;gap:2px;height:34px;border-radius:5px;overflow:hidden}
.strip div{flex:1;display:flex;align-items:flex-end;justify-content:center;
  font-family:var(--mono);font-size:9px;font-weight:700;color:#0E161F;padding-bottom:2px}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
  color:var(--dim);margin-top:4px}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;
  font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:400;font-size:9.5px;letter-spacing:.05em}
.tblWrap{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:4px 10px 6px;margin-bottom:10px;overflow-x:auto}

.btnRow{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:10px;font-size:12.5px;font-weight:700;font-family:var(--sans);cursor:pointer}
.btn.amber{background:var(--amber);color:#0E161F;border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:default}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--rule);
  border-radius:5px;padding:4px 8px;font-size:11px;font-family:var(--mono)}
.chip i{width:14px;height:3px;border-radius:2px;display:block}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px}

.note{font-size:10.5px;color:var(--dim);line-height:1.6;font-family:var(--mono)}
.empty{padding:30px 14px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}
@media(max-width:400px){.rGrid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:no-preference){
  .lineDraw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw .55s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style>

<div class="wrap">
<header>
  <h1>ラップ断面</h1>
  <p id="metaLine"></p>
</header>

<div class="tabs" role="tablist">
  <button id="tabCond" role="tab" aria-selected="true">条件別</button>
  <button id="tabGrade" role="tab" aria-selected="false">重賞別</button>
</div>

<!-- 条件別 -->
<div id="paneCond">
  <div class="filters">
    <div><label>競馬場</label><select id="fVenue"></select></div>
    <div><label>芝／ダート</label><select id="fSurf"></select></div>
    <div><label>距離</label><select id="fDist"></select></div>
    <div><label>クラス</label><select id="fClass"></select></div>
    <div class="full"><label>馬場状態</label><select id="fGoing"></select></div>
  </div>
  <div class="btnRow">
    <button class="btn amber" id="btnAdd">この条件を重ねる</button>
    <button class="btn" id="btnClear">重ねを消す</button>
  </div>
</div>

<!-- 重賞別 -->
<div id="paneGrade" hidden>
  <div class="filters">
    <div class="full"><label>重賞レース</label><select id="fRace"></select></div>
  </div>
</div>

<div id="legend" class="legend"></div>
<div id="readout"></div>
<div class="chartBox"><svg id="chart" viewBox="0 0 700 340" role="img" aria-label="ラップ推移グラフ"></svg></div>
<div class="stripWrap">
  <div class="stripLbl">ペース断面（濃い赤＝速い区間／青＝遅い区間）</div>
  <div class="strip" id="strip"></div>
  <div class="scale"><span>スタート</span><span>ゴール</span></div>
</div>
<div class="tblWrap"><table id="tbl"></table></div>
<p class="note" id="note"></p>
</div>

22-03-27","c":"重","l":[12.1,10.3,11.0,11.0,11.5,12.4],"w":68.3},{"y":"2023","d":"2023-03-26","c":"不良","l":[12.5,11.3,11.8,11.6,11.9,12.4],"w":71.5},{"y":"2024","d":"2024-03-24","c":"重","l":[12.5,10.8,11.6,11.4,11.0,11.6],"w":68.9},{"y":"2026","d":"2026-03-29","c":"良","l":[12.1,9.8,10.6,11.1,11.6,11.1],"w":66.3}]},"鳴尾記念":{"g":"GIII","v":"中京","s":"芝","dist":2000,"avg":[12.6,11.38,12.22,12.1,12.02,12.12,11.62,11.32,11.4,11.88],"yrs":[{"y":"2021","d":"2021-06-05","c":"良","l":[13.1,11.9,13.0,12.6,12.3,12.2,11.5,11.1,11.1,11.9],"w":120.7},{"y":"2022","d":"2022-06-04","c":"良","l":[12.4,11.3,12.4,12.0,12.0,11.9,11.4,11.3,11.1,11.9],"w":117.7},{"y":"2023","d":"2023-06-03","c":"良","l":[12.7,11.2,11.9,11.9,11.9,12.1,11.8,11.5,11.8,12.3],"w":119.1},{"y":"2024","d":"2024-06-01","c":"良","l":[12.2,11.1,11.6,11.9,11.9,12.3,11.8,11.4,11.6,11.4],"w":117.2}]}},"meta":{"from":"2021-01-02","to":"2026-07-19","races":17822}}</script>
<script>
const DATA = JSON.parse(document.getElementById('lapdata').textContent);
const COND = DATA.cond, GRADE = DATA.grade;
const SER = ['#FFB13B','#5BC08A','#4A9BD8','#D9945A','#C58CE0'];

document.getElementById('metaLine').textContent =
  `${DATA.meta.from} 〜 ${DATA.meta.to} ／ ${DATA.meta.races.toLocaleString()}レース`;

// ---- キー分解 ----
const rows = Object.keys(COND).map(k=>{
  const [v,s,d,c,g] = k.split('|');
  return {key:k, venue:v, surf:s, dist:+d, cls:c, going:g};
});
const VORDER = ['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉','大井','船橋','川崎','浦和'];
const CORDER = ['新馬','未勝利','1勝','2勝','3勝','オープン','その他'];
const ord=(a,arr)=>{const i=arr.indexOf(a);return i<0?99:i;};

let overlays = [];   // 重ねた条件のキー
let mode = 'cond';

function fill(sel, items, keep){
  const cur = keep && items.includes(sel.value) ? sel.value : items[0];
  sel.innerHTML = items.map(v=>`<option value="${v}">${v}</option>`).join('');
  sel.value = cur;
}
const $ = id=>document.getElementById(id);

function refreshFilters(changed){
  const v = $('fVenue').value, s = $('fSurf').value, d = +$('fDist').value, c = $('fClass').value;
  fill($('fVenue'), [...new Set(rows.map(r=>r.venue))].sort((a,b)=>ord(a,VORDER)-ord(b,VORDER)), true);
  const V = $('fVenue').value;
  fill($('fSurf'), [...new Set(rows.filter(r=>r.venue===V).map(r=>r.surf))].sort(), true);
  const S = $('fSurf').value;
  fill($('fDist'), [...new Set(rows.filter(r=>r.venue===V&&r.surf===S).map(r=>r.dist))].sort((a,b)=>a-b).map(String), true);
  const D = +$('fDist').value;
  fill($('fClass'), [...new Set(rows.filter(r=>r.venue===V&&r.surf===S&&r.dist===D).map(r=>r.cls))]
      .sort((a,b)=>ord(a,CORDER)-ord(b,CORDER)), true);
  const C = $('fClass').value;
  fill($('fGoing'), [...new Set(rows.filter(r=>r.venue===V&&r.surf===S&&r.dist===D&&r.cls===C).map(r=>r.going))].sort(), true);
}

function curKey(){
  return [$('fVenue').value,$('fSurf').value,$('fDist').value,$('fClass').value,$('fGoing').value].join('|');
}
const label = k => { const [v,s,d,c,g]=k.split('|'); return `${v}${s}${d}m ${c} ${g}`; };

// 端数1F目を200m換算
function norm(laps, dist){
  const n = laps.length, first = dist - 200*(n-1);
  const out = laps.slice();
  if(first>0 && first<200) out[0] = laps[0]*200/first;
  return {norm:out, first:first};
}
function cums(laps, dist){
  const n = laps.length, first = dist - 200*(n-1), a=[];
  for(let i=0;i<n;i++) a.push(first + 200*i);
  return a;
}

// ---- 描画 ----
function draw(series, dist){
  const W=700,H=340,ML=44,MR=14,MT=16,MB=42;
  const all = series.flatMap(s=>s.norm);
  let lo=Math.min(...all), hi=Math.max(...all);
  const pad=(hi-lo)*0.18 || .6; lo-=pad; hi+=pad;
  const n = Math.max(...series.map(s=>s.norm.length));
  const X = i => ML + (W-ML-MR) * (n===1?0.5:i/(n-1));
  const Y = v => MT + (H-MT-MB) * (1 - (v-lo)/(hi-lo));
  let g='';
  // Y軸グリッド
  const step = (hi-lo)>6?2:((hi-lo)>3?1:0.5);
  for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step){
    g+=`<line x1="${ML}" y1="${Y(t).toFixed(1)}" x2="${W-MR}" y2="${Y(t).toFixed(1)}" stroke="#27384A" stroke-width="1"/>`;
    g+=`<text x="${ML-7}" y="${(Y(t)+4).toFixed(1)}" fill="#8195A8" font-size="11" font-family="ui-monospace,monospace" text-anchor="end">${t.toFixed(1)}</text>`;
  }
  // X軸ラベル（通過距離）
  const cm = cums(series[0].raw, dist);
  const stride = n>10?2:1;
  for(let i=0;i<n;i+=stride){
    g+=`<text x="${X(i).toFixed(1)}" y="${H-MB+20}" fill="#8195A8" font-size="10.5" font-family="ui-monospace,monospace" text-anchor="middle">${cm[i]||''}</text>`;
  }
  g+=`<text x="${W/2}" y="${H-6}" fill="#8195A8" font-size="10.5" font-family="ui-monospace,monospace" text-anchor="middle">通過距離 (m)</text>`;
  // 系列
  series.forEach((s,si)=>{
    const col = s.color || SER[si%SER.length];
    const pts = s.norm.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${s.thin?1.4:2.8}"
         stroke-opacity="${s.thin?0.45:1}" stroke-linejoin="round" stroke-linecap="round" class="${s.thin?'':'lineDraw'}"/>`;
    if(!s.thin) s.norm.forEach((v,i)=>{
      g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="${i===0&&s.partial?'#16202C':col}" stroke="${col}" stroke-width="1.6"/>`;
    });
  });
  $('chart').innerHTML = g;
}

function pace(f3,l3){
  const d = f3-l3;
  if(d<=-1.0) return {t:'ハイペース',c:'#FF6B4A'};
  if(d<=-0.3) return {t:'やや前傾',c:'#D9945A'};
  if(d< 0.4)  return {t:'ミドル',c:'#FFB13B'};
  if(d< 1.2)  return {t:'やや後傾',c:'#5BC08A'};
  return {t:'スローペース',c:'#4A9BD8'};
}

function renderStrip(nl){
  const lo=Math.min(...nl), hi=Math.max(...nl), rng=(hi-lo)||1;
  $('strip').innerHTML = nl.map((v,i)=>{
    const t=(v-lo)/rng;                       // 0=速い 1=遅い
    const col = `hsl(${(8+t*200).toFixed(0)},72%,${(58-t*8).toFixed(0)}%)`;
    return `<div style="background:${col}" title="${v.toFixed(1)}秒">${nl.length<=13?v.toFixed(1):''}</div>`;
  }).join('');
}

function renderTable(raw, nl, dist){
  const cm = cums(raw, dist);
  let h = '<tr><th>通過</th>' + raw.map((_,i)=>`<th>${cm[i]}</th>`).join('') + '</tr>';
  h += '<tr><td>ラップ</td>' + raw.map(v=>`<td>${v.toFixed(1)}</td>`).join('') + '</tr>';
  let acc=0;
  h += '<tr><td>累計</td>' + raw.map(v=>{acc+=v;return `<td>${acc.toFixed(1)}</td>`;}).join('') + '</tr>';
  $('tbl').innerHTML = h;
}

function renderCond(){
  const k = curKey(), rec = COND[k];
  if(!rec){ $('readout').innerHTML='<div class="readout empty">この条件のラップは記録がありません。<br>距離かクラスを変えてください。</div>'; return; }
  const dist = +k.split('|')[2];
  const {norm:nl, first} = norm(rec.l, dist);
  const f3 = rec.l.slice(0,3).reduce((a,b)=>a+b,0), l3 = rec.l.slice(-3).reduce((a,b)=>a+b,0);
  const p = pace(f3,l3);
  const fastest = nl.indexOf(Math.min(...nl)), cm = cums(rec.l, dist);

  $('readout').innerHTML = `<div class="readout">
    <div class="rTop"><span class="rTitle">${label(k)}</span>
      <span class="badge" style="background:${p.c};color:#0E161F">${p.t}</span></div>
    <div class="rGrid">
      <div class="cell"><div class="k">前半3F</div><div class="v">${f3.toFixed(1)}</div></div>
      <div class="cell"><div class="k">上がり3F</div><div class="v">${l3.toFixed(1)}</div></div>
      <div class="cell"><div class="k">最速区間</div><div class="v">${cm[fastest]}<small>m</small></div></div>
      <div class="cell"><div class="k">平均勝時計</div><div class="v">${rec.w?fmt(rec.w):'—'}</div></div>
      <div class="cell"><div class="k">サンプル</div><div class="v">${rec.n}<small>R</small></div></div>
      <div class="cell"><div class="k">最速勝時計</div><div class="v">${rec.wb?fmt(rec.wb):'—'}</div></div>
      <div class="cell"><div class="k">前半−上がり</div><div class="v">${(f3-l3>0?'+':'')+(f3-l3).toFixed(1)}</div></div>
      <div class="cell"><div class="k">ハロン</div><div class="v">${rec.l.length}<small>F</small></div></div>
    </div></div>`;

  const series = [{norm:nl, raw:rec.l, partial:first<200, color:SER[0]}];
  overlays.filter(o=>o!==k).forEach((o,i)=>{
    const r2=COND[o]; if(!r2) return;
    const d2=+o.split('|')[2];
    series.push({norm:norm(r2.l,d2).norm, raw:r2.l, color:SER[(i+1)%SER.length]});
  });
  draw(series, dist);
  renderStrip(nl);
  renderTable(rec.l, nl, dist);
  $('legend').innerHTML = series.length>1 ? series.map((s,i)=>{
    const kk = i===0?k:overlays.filter(o=>o!==k)[i-1];
    return `<span class="chip"><i style="background:${s.color}"></i>${label(kk)}${i>0?`<button data-rm="${kk}">×</button>`:''}</span>`;
  }).join('') : '';
  $('note').innerHTML = `※1ハロン目が端数の距離（1700m・1500mなど）は、グラフのみ200m換算に補正。下の表は実測値。<br>※平均${rec.n}レースの平均ラップ。`;
}

function fmt(sec){
  if(sec==null) return '—';
  if(sec<60) return sec.toFixed(1);
  const m=Math.floor(sec/60), s=sec-m*60;
  return `${m}:${s<10?'0':''}${s.toFixed(1)}`;
}

function renderGrade(){
  const name = $('fRace').value, rec = GRADE[name];
  if(!rec) return;
  const dist = rec.dist;
  const {norm:nl, first} = norm(rec.avg, dist);
  const f3 = rec.avg.slice(0,3).reduce((a,b)=>a+b,0), l3 = rec.avg.slice(-3).reduce((a,b)=>a+b,0);
  const p = pace(f3,l3);
  const cm = cums(rec.avg, dist), fastest = nl.indexOf(Math.min(...nl));

  $('readout').innerHTML = `<div class="readout">
    <div class="rTop"><span class="rTitle">${name} <span style="color:var(--dim);font-weight:400">${rec.g}</span></span>
      <span class="badge" style="background:${p.c};color:#0E161F">${p.t}</span></div>
    <div class="rGrid">
      <div class="cell"><div class="k">コース</div><div class="v" style="font-size:13px">${rec.v}${rec.s}${dist}</div></div>
      <div class="cell"><div class="k">前半3F</div><div class="v">${f3.toFixed(1)}</div></div>
      <div class="cell"><div class="k">上がり3F</div><div class="v">${l3.toFixed(1)}</div></div>
      <div class="cell"><div class="k">最速区間</div><div class="v">${cm[fastest]}<small>m</small></div></div>
    </div></div>`;

  const series = rec.yrs.map(y=>({norm:norm(y.l,dist).norm, raw:y.l, thin:true, color:'#8195A8'}));
  series.push({norm:nl, raw:rec.avg, partial:first<200, color:SER[0]});
  draw(series, dist);
  renderStrip(nl);
  renderTable(rec.avg, nl, dist);

  $('legend').innerHTML = `<span class="chip"><i style="background:${SER[0]}"></i>${rec.yrs.length}年平均</span>`
    + rec.yrs.map(y=>`<span class="chip"><i style="background:#8195A8"></i>${y.y} ${y.c} ${fmt(y.w)}</span>`).join('');
  $('note').innerHTML = `※細い灰色の線＝各年の実ラップ、太い橙＝${rec.yrs.length}年平均。年ごとの馬場状態と勝ち時計は上のチップに表示。`;
}

// ---- イベント ----
['fVenue','fSurf','fDist','fClass','fGoing'].forEach(id=>{
  $(id).addEventListener('change',()=>{ refreshFilters(); renderCond(); });
});
$('btnAdd').addEventListener('click',()=>{
  const k=curKey(); if(!COND[k]) return;
  if(!overlays.includes(k) && overlays.length<4) overlays.push(k);
  renderCond();
});
$('btnClear').addEventListener('click',()=>{ overlays=[]; renderCond(); });
$('legend').addEventListener('click',e=>{
  const rm=e.target.dataset&&e.target.dataset.rm;
  if(rm){ overlays=overlays.filter(o=>o!==rm); renderCond(); }
});
$('fRace').addEventListener('change', renderGrade);
$('tabCond').addEventListener('click',()=>setMode('cond'));
$('tabGrade').addEventListener('click',()=>setMode('grade'));

function setMode(m){
  mode=m;
  $('tabCond').setAttribute('aria-selected', m==='cond');
  $('tabGrade').setAttribute('aria-selected', m==='grade');
  $('paneCond').hidden = m!=='cond';
  $('paneGrade').hidden = m!=='grade';
  m==='cond'?renderCond():renderGrade();
}

// 初期化
refreshFilters();
const gnames = Object.keys(GRADE).sort((a,b)=>{
  const A=GRADE[a],B=GRADE[b];
  return (A.g.length-B.g.length)||A.g.localeCompare(B.g)||a.localeCompare(b,'ja');
});
$('fRace').innerHTML = gnames.map(n=>`<option value="${n}">${GRADE[n].g}｜${n}（${GRADE[n].v}${GRADE[n].s}${GRADE[n].dist}）</option>`).join('');
