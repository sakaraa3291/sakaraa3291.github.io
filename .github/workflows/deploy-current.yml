name: Deploy current main to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keiba-production-update
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Refuse stale main before staging
        run: python -m automation.racecard.guard head
      - name: Stage public site only
        run: python automation/stage_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Refuse stale main immediately before deployment
        run: python -m automation.racecard.guard head
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed public hashes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python automation/verify_public.py --url "$PAGE_URL"
