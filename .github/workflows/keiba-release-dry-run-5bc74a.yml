name: Verify the merged Keiba weekly workflow once
on:
  push:
    branches:
      - codex/keiba-verify-20261125-5bc74a
    paths:
      - '.github/workflows/keiba-release-dry-run-5bc74a.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'sakaraa3291/sakaraa3291.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the existing main workflow in dry-run mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api repos/sakaraa3291/sakaraa3291.github.io/git/ref/heads/main --jq .object.sha)
          test "$actual" = "9f1a4e05e51f9815af1e2ff5dc08eb961f803d3e"
          gh api --method POST repos/sakaraa3291/sakaraa3291.github.io/actions/workflows/keiba-update.yml/dispatches -H 'X-GitHub-Api-Version: 2026-03-10' --input - <<'JSON'
          {"ref":"main","inputs":{"dry_run":true,"to_date":"2026-11-23","request_id":"5bc74a3e-5b5a-44bb-97a7-1a2fa8c2cd5d"}}
          JSON
