<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c3a">
<title>せどり 静音JANスキャナー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1113;color:#fff;font:16px system-ui,-apple-system,sans-serif}
main{max-width:680px;margin:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:21px;margin:8px 0 4px}.sub{color:#c8d5d1;margin:0 0 12px;line-height:1.5}
#reader{position:relative;min-height:58vh;background:#000;border-radius:14px;overflow:hidden}
#reader video,#reader canvas{width:100%!important;height:100%!important;min-height:58vh;object-fit:cover}
.frame{position:absolute;z-index:10;left:5%;right:5%;top:29%;height:38%;border:4px solid #fff;border-radius:12px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
.frame:before,.frame:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:rgba(255,255,255,.5)}
.frame:before{top:33%}.frame:after{bottom:33%}
#status{margin:12px 0;padding:12px;border-radius:10px;background:#172326;font-weight:700;line-height:1.5}
button{width:100%;min-height:52px;border:0;border-radius:10px;font:inherit;font-weight:800;margin-top:8px;background:#16835c;color:#fff}
button.secondary{background:#34464b}.hint{color:#c8d5d1;font-size:14px;line-height:1.55;margin-top:10px}
.error{background:#5e2424!important}.ok{background:#154f35!important}
</style>
</head>
<body>
<main>
<h1>静音JANスキャナー</h1>
<p class="sub">シャッター撮影はしません。カメラ映像を端末内で読み取り、画像は保存しません。</p>
<div id="reader"><div class="frame"></div></div>
<div id="status">カメラを準備しています…</div>
<button id="start" type="button">カメラを開始</button>
<button id="cancel" class="secondary" type="button">v1.3へ戻る</button>
<p class="hint">バーコードを白枠いっぱいまで近づけてください。ペットボトルなど曲面ラベルは、反射を避けるよう少し傾けると読みやすくなります。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script>
'use strict';
const RETURN_URL='https://script.google.com/macros/s/AKfycbxWfOpoElmicQItrz-9sfOXmahU0wP-udhIxDExC3ixC-QwVCzkyRLRAIRbzYbfPqTn/exec';
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
let running=false,accepted=false,lastCode='',lastAt=0,repeat=0,detector=null;

function setStatus(text,kind){statusEl.textContent=text;statusEl.className=kind||'';}
function validChecksum(code){
  if(typeof code!=='string'||!/^(?:\d{8}|\d{12}|\d{13})$/.test(code))return false;
  const digits=code.split('').map(Number),check=digits.pop();
  let sum=0,weight=3;
  for(let i=digits.length-1;i>=0;i--){sum+=digits[i]*weight;weight=weight===3?1:3;}
  return (10-(sum%10))%10===check;
}
function stop(){
  if(window.Quagga&&detector){try{Quagga.offDetected(detector)}catch(e){}}
  if(window.Quagga&&running){try{Quagga.stop()}catch(e){}}
  document.querySelectorAll('#reader video').forEach(v=>{if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());});
  running=false;detector=null;
}
async function tuneCamera(){
  const video=document.querySelector('#reader video');
  const track=video&&video.srcObject&&video.srcObject.getVideoTracks()[0];
  if(!track||!track.getCapabilities||!track.applyConstraints)return;
  try{
    const caps=track.getCapabilities(),adv={};
    if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))adv.focusMode='continuous';
    if(caps.zoom&&typeof caps.zoom.max==='number'&&caps.zoom.max>1)adv.zoom=Math.min(caps.zoom.max,Math.max(caps.zoom.min||1,1.25));
    if(Object.keys(adv).length)await track.applyConstraints({advanced:[adv]});
  }catch(e){}
}
async function start(){
  if(running||accepted)return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus('このブラウザではカメラを使えません。画面右下のコンパス等からSafariで開いてください。','error');
    return;
  }
  if(!window.Quagga){setStatus('読取ライブラリを読み込めませんでした。通信を確認してください。','error');return;}
  startBtn.disabled=true;setStatus('カメラを起動しています…');
  try{
    await new Promise((resolve,reject)=>{
      Quagga.init({
        inputStream:{name:'JAN',type:'LiveStream',target:document.getElementById('reader'),constraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},area:{top:'8%',right:'1%',left:'1%',bottom:'8%'}},
        locate:true,frequency:10,locator:{patchSize:'medium',halfSample:false},
        numOfWorkers:Math.min(4,navigator.hardwareConcurrency||2),
        decoder:{readers:['ean_reader','ean_8_reader','upc_reader'],multiple:false}
      },err=>err?reject(err):resolve());
    });
    detector=result=>{
      if(accepted)return;
      const code=result&&result.codeResult&&String(result.codeResult.code||'');
      if(!validChecksum(code))return;
      const now=Date.now();
      if(code===lastCode&&now-lastAt<2000)repeat++;else repeat=1;
      lastCode=code;lastAt=now;
      setStatus('候補 '+code+' を確認中… '+repeat+'/2');
      if(repeat<2)return;
      accepted=true;stop();
      setStatus('JAN '+code+' を読み取りました。v1.3へ戻ります。','ok');
      setTimeout(()=>location.replace(RETURN_URL+'?scanJan='+encodeURIComponent(code)),450);
    };
    Quagga.onDetected(detector);
    Quagga.start();running=true;
    await new Promise(r=>setTimeout(r,350));
    await tuneCamera();
    setStatus('読取中です。バーコードを白枠いっぱいに近づけてください。');
  }catch(err){
    stop();
    setStatus('カメラを開始できませんでした。Safariで開き、カメラを「許可」にしてください。','error');
  }finally{startBtn.disabled=false;}
}
startBtn.addEventListener('click',start);
document.getElementById('cancel').addEventListener('click',()=>{stop();location.href=RETURN_URL;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
window.addEventListener('pagehide',stop);
setTimeout(start,150);
</script>
</body>
</html>
